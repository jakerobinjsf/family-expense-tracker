<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17845a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Family Expense Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>Expense Entry</h1>
</header>

<main>
  <section id="budget-card" class="budget-card" aria-labelledby="budget-title">
    <div class="budget-heading">
      <div><p class="eyebrow">THIS MONTH</p><h2 id="budget-title">Personal Budget</h2></div>
      <button type="button" id="budget-edit-btn" class="text-btn">Set budget</button>
    </div>
    <div id="budget-display" class="budget-display" hidden>
      <div class="budget-numbers"><strong id="budget-spent">₱0</strong><span>of <span id="budget-limit">₱0</span></span></div>
      <div class="budget-track" aria-hidden="true"><span id="budget-bar"></span></div>
      <p id="budget-message" class="budget-message"></p>
    </div>
    <div id="budget-editor" class="budget-editor" hidden>
      <label for="budget-input">Monthly limit (PHP)</label>
      <div class="budget-editor-row"><input id="budget-input" type="number" inputmode="decimal" min="0" step="100" placeholder="e.g. 50000"><button type="button" id="budget-save-btn">Save</button></div>
    </div>
  </section>

  <form id="expense-form" autocomplete="off">
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>
    </div>

    <div class="field">
      <label for="description">Description</label>
      <input type="text" id="description" name="description" placeholder="e.g. Coffee Beans" required>
    </div>

    <div class="field">
      <label for="amount">Amount (PHP)</label>
      <input type="number" id="amount" name="amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="Personal">Personal</option>
        <option value="Jenny Flores Art">Jenny Flores Art</option>
        <option value="After.Seven">After.Seven</option>
      </select>
    </div>

    <div class="field" id="subcategory-field">
      <label for="subcategory">Personal Subcategory</label>
      <select id="subcategory" name="subcategory" required></select>
    </div>

    <div id="duplicate-warning" class="duplicate-warning" role="alert" hidden>
      <strong>Possible double entry</strong><p id="duplicate-message"></p>
      <div class="duplicate-actions"><button type="button" id="save-anyway-btn">Save anyway</button><button type="button" id="duplicate-cancel-btn">Review entry</button></div>
    </div>

    <button type="submit" id="save-btn" class="save-btn">SAVE EXPENSE</button>
  </form>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="recent-section">
    <h2>Recent Expenses <span class="subtitle">(Last 7 Days)</span></h2>
    <div id="recent-list" class="recent-list">
      <p class="empty-state" id="empty-state">Loading…</p>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
