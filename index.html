<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17845a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Family Expense Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>Expense Entry</h1>
</header>

<main>
  <form id="expense-form" autocomplete="off">
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>
    </div>

    <div class="field">
      <label for="description">Description</label>
      <input type="text" id="description" name="description" placeholder="e.g. Coffee Beans" required>
    </div>

    <div class="field">
      <label for="amount">Amount (PHP)</label>
      <input type="number" id="amount" name="amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="Personal">Personal</option>
        <option value="Jenny Flores Art">Jenny Flores Art</option>
        <option value="After.Seven">After.Seven</option>
      </select>
    </div>

    <button type="submit" id="save-btn" class="save-btn">SAVE EXPENSE</button>
  </form>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="recent-section">
    <h2>Recent Expenses <span class="subtitle">(Last 7 Days)</span></h2>
    <div id="recent-list" class="recent-list">
      <p class="empty-state" id="empty-state">Loading…</p>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
